name: Déploiement Firebase Hosting + Functions

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Cloner le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les dépendances root (React/Vite)
        run: npm install

      - name: Construire le site Vite
        run: npm run build

      - name: Installer les dépendances des fonctions
        run: npm install
        working-directory: functions

      - name: Déployer Hosting + Functions
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccountToken: "${{ secrets.FIREBASE_TOKEN }}"
          projectId: buyticle-bce3f
