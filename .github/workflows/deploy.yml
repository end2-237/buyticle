name: Déploiement Firebase Hosting + Functions

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Cloner le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer dépendances du projet React
        run: npm install

      - name: Construire le site avec Vite
        run: npm run build

      - name: Installer les dépendances des fonctions Firebase
        run: npm install
        working-directory: functions

      - name: Déployer vers Firebase (Hosting + Functions)
        run: |
          npm install -g firebase-tools
          firebase deploy --project=buyticle-bce3f,functions --token "${{ secrets.FIREBASE_TOKEN }}"
